# steaminghe プロファイル例（bash の source 形式）
APPID=480                                  # Steam AppID（ストアURLの数字）
GAME_EXE='Z:\games\Spacewar\Spacewar.exe'  # Wine から見たゲーム exe
GAME_DIR=/storage/emulated/0/games/Spacewar  # 作業ディレクトリ（Linux パス、任意）
GAME_ARGS=''

# online : ゲーム中ずっと Steam 常駐（マルチ・実績・クラウドが要るゲーム）
# offline: ゲームが Steam に繋がったら Steam を止める（DRM チェックだけ通ればいいゲーム）
MODE=offline

# offline 時の止め方
#   freeze   : SIGSTOP で凍結。CPU 使用ほぼ 0、ゲームとの IPC は保持。まずはこれ
#   shutdown : Steam を終了。メモリも空くが、終了を検知して落ちるゲームがある
OFFLINE_STRATEGY=freeze
GRACE_SEC=20         # Running フラグ確認から停止までの猶予（初期化が遅いゲームは延ばす）
RUNNING_TIMEOUT=120

# online 時に CEF(steamwebhelper) を凍結するか。UI/オーバーレイは使えなくなる
WEBHELPER=keep

STEAM_NICE=19        # Steam の優先度（19 = 最低）
STEAM_CPUS=0-3       # Steam を固定するコア（多くの SoC では 0-3 が省電力コア）
KEEP_STEAM_AFTER=0   # 1 ならゲーム終了後も Steam を残す
